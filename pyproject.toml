[project]
name = "golden-gates"
version = "1.0.0"
description = "Merge gates for the Golden Pipeline: diff coverage, test presence, coverage ratchet, mutation score, policy, scorecard."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["diff-cover>=10.6,<11"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
golden = "golden.cli:main"

[project.urls]
Homepage = "https://github.com/Mira190/golden-pipeline-open"
Documentation = "https://github.com/Mira190/golden-pipeline-open/tree/main/docs"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "mutmut>=3.8",
    "mypy>=2.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=4.0",
    "pytest-repeat>=0.9.4",
    "pytest-xdist>=3.8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden"]

[tool.hatch.build.targets.sdist]
include = ["src/golden", "README.md", "LICENSE"]

[tool.uv]
# Supply-chain cooldown: never resolve a release younger than 7 days.
exclude-newer = "7 days"
# The build backend is a dependency too: pin it, so building the CLI in a consumer's
# job (actions/setup) is as reproducible as installing its locked dependencies.
build-constraint-dependencies = ["hatchling==1.32.4"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Examples are separate projects with their own configuration.
extend-exclude = ["examples", "mutants"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "PT", "PL",
    "RUF", "N", "ANN", "BLE", "T20", "PERF", "C90", "DTZ", "PTH",
]
ignore = ["PLR2004", "S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "PLR0913", "PLR0917", "DTZ"]
"src/golden/{report,cli,local}.py" = ["T20"]
"scripts/**" = ["T20", "S603", "ANN", "PLR0914"]
"evals/**" = ["T20", "S603"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
norecursedirs = ["examples", "mutants", ".*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# The drill harness and the decision benchmark are held to the same bar as the CLI.
source = ["golden", "evals", "scripts"]
omit = ["*/golden/__main__.py"]
relative_files = true

[tool.coverage.paths]
source = ["src/golden", "*/site-packages/golden"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mutmut]
source_paths = ["src/golden/"]
pytest_add_cli_args = ["-p", "no:randomly", "-x", "-q"]
# tests/test_evals.py and tests/test_drill.py load evals/, scripts/ and the example
# projects from the sandbox.
also_copy = ["evals/", "scripts/", "examples/"]
# "Arid" lines (Google, TSE 2021): mutating them yields no actionable test.
do_not_mutate_patterns = [
    'help="',                          # argparse help text
    'encoding="utf-8"',                # explicit default encoding
    'print\(.*file=sys\.stderr\)',      # diagnostics for humans
    'capture_output=True, text=True',  # subprocess plumbing
]
