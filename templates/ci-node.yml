# Copy to .github/workflows/ci.yml, replace <sha> with a full commit SHA of
# Mira190/golden-pipeline-open, then require the `ci / golden` check in a ruleset.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Mira190/golden-pipeline-open/.github/workflows/golden.yml@<sha> # v1.0.0
    permissions:
      contents: read
    with:
      language: node
