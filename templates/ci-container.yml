# Pipeline plus a signed container image published from the default branch.
name: ci

on:
  pull_request:
    # labeled/unlabeled: the test-presence opt-out label takes effect at once.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  # Daily on the default branch: new advisories, toolchain drift and flaky
  # tests surface here, not as a surprise on somebody's unrelated PR.
  schedule:
    - cron: "23 6 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Mira190/golden-pipeline-open/.github/workflows/golden.yml@<sha> # v1.0.0
    permissions:
      contents: read
    with:
      language: python

  image:
    needs: ci
    uses: Mira190/golden-pipeline-open/.github/workflows/container.yml@<sha> # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      smoke-command: docker run --rm "$IMAGE" --help

  # Require this single check in your ruleset.
  golden:
    if: always()
    needs: [ci, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
