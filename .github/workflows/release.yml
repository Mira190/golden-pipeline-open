# Tag vX.Y.Z on main -> GitHub release with a signed, attested wheel and sdist.
# Enable "immutable releases" in the repository settings so a published tag can
# never be moved or reused.
#
# Nobody "decides" a release is good: the tagged commit must be on main and
# must already have passed the `ci` check, or nothing is published.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      checks: read # verify `ci` passed on the tagged commit
      id-token: write # Sigstore keyless signing
      attestations: write # SLSA build provenance
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must match the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/golden/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match src/golden/__init__.py ($version)"
            exit 1
          }
          grep -q "^version = \"$version\"" pyproject.toml || {
            echo "::error::pyproject.toml version does not match $version"
            exit 1
          }
      - name: Tagged commit must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH; tag a commit that was merged"
            exit 1
          }
      # Only GitHub Actions' own check run counts: any GitHub App with
      # `checks: write` could post a green check named `ci`.
      - name: Tagged commit must have passed ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion] | join(" ")')"
          echo "ci check runs on $GITHUB_SHA: ${conclusions:-none}"
          case " $conclusions " in
            *" success "*) ;;
            *) echo "::error::the ci check has not passed on $GITHUB_SHA"; exit 1 ;;
          esac
      - uses: $/actions/setup
        with:
          cache: "false"
      - name: Build wheel and sdist
        run: uv build --no-sources --out-dir dist
      - name: Attest build provenance (SLSA, Sigstore keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME"
