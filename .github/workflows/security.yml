# Language-agnostic supply-chain and secret scanning. Called by golden.yml and
# usable on its own for any repository:
#
#   jobs:
#     security:
#       uses: Mira190/golden-pipeline-open/.github/workflows/security.yml@<sha> # v1.x.y
name: golden-security

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory whose lockfiles are scanned for vulnerable dependencies.
        type: string
        default: "."
      fail-on-severity:
        description: dependency-review threshold (low, moderate, high, critical).
        type: string
        default: high
      workflow-lint:
        description: Lint workflows for correctness with actionlint (and shellcheck on run blocks).
        type: boolean
        default: true
      allow-licenses:
        description: Comma-separated SPDX allowlist for new dependencies (empty = no licence gate).
        type: string
        default: ""
      runs-on:
        type: string
        default: ubuntu-24.04
      egress-policy:
        type: string
        default: audit

permissions: {}

jobs:
  secrets:
    name: secrets
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks CLI from an image pinned by digest (gitleaks-action needs a
      # licence key for organisations and sends repository metadata out).
      - name: Scan for committed secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          range=()
          if [ -n "$BASE" ]; then range=(--log-opts="$BASE..HEAD"); fi
          docker run --rm -v "$PWD:/repo:ro" "$IMAGE" git /repo --redact --no-banner "${range[@]}"

  dependencies:
    name: dependencies
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Who introduced the advisory decides who must act on it. A pull request
      # is blocked only for what it adds (dependency review, below); an advisory
      # published today against a dependency it doesn't touch is reported, not
      # blocking, or every open PR would go red at once and people would learn
      # to ask for bypasses. Default-branch pushes and the scheduled run block:
      # fix it, or add an expiring `[[IgnoredVulns]]` entry to osv-scanner.toml
      # (`golden policy check` enforces reason + ignoreUntil <= 90 days).
      - name: Known vulnerabilities in lockfiles (OSV)
        id: osv
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ${{ inputs.working-directory }}
      - name: Report advisories in existing dependencies
        if: steps.osv.outcome == 'failure'
        run: |
          msg="OSV-Scanner found known vulnerabilities in dependencies this pull request does not change (see the step above). Not blocking here; the default branch run will block until they are fixed or excepted in osv-scanner.toml with an expiry."
          echo "::warning::$msg"
          printf '#### ⚠️ Vulnerability scan: report-only on pull requests\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: New dependencies in this pull request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allow-licenses }}
          comment-summary-in-pr: never

  workflows:
    name: workflows
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor finds security problems; actionlint finds bugs: bad expressions,
      # unknown inputs, and shellcheck findings in `run:` blocks. Image pinned by
      # digest (it bundles shellcheck), like gitleaks above.
      - name: Lint GitHub Actions workflows (actionlint + shellcheck)
        if: inputs.workflow-lint && hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != ''
        env:
          IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        # actionlint 1.7.12 predates the `$/` self-repository syntax (2026-07).
        run: >-
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo "$IMAGE" -color
          -ignore 'specifying action "\$/'
          -ignore 'reusable workflow call "\$/'
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.0
          advanced-security: false
          persona: regular
