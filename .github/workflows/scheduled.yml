# Post-submit loop: run the whole test suite N times on one commit of the default branch and
# report the tests that pass in some runs and fail in others (flaky), and the ones that fail
# every time (the default branch is red). Call it nightly:
#
#   on:
#     schedule:
#       - cron: "23 3 * * *"
#   jobs:
#     flaky-scan:
#       uses: Mira190/golden-pipeline-open/.github/workflows/scheduled.yml@<sha> # v1.x.y
#       permissions:
#         contents: read
#       with:
#         language: python
#
# The job turns red on any flaky or failing test and lists them in the job summary. It opens no
# issues, so it needs no write permission.
name: golden-scheduled

on:
  workflow_call:
    inputs:
      language:
        description: python, node or go
        type: string
        required: true
      working-directory:
        description: Project directory inside the repository (monorepos).
        type: string
        default: "."
      runs:
        description: How many times to run the suite (at least 2).
        type: number
        default: 5
      versions:
        description: JSON list of language versions; the last one runs the scan.
        type: string
        default: ""
      install-command:
        type: string
        default: ""
      test-command:
        description: >-
          Runs the whole suite once in random order and must write a JUnit XML report (or, for
          go, a `go test -json` stream) to $GOLDEN_REPORT. Empty = the language default, see
          `golden flaky-scan --print-command LANGUAGE`.
        type: string
        default: ""
      timeout-minutes:
        description: Time limit for all runs together.
        type: number
        default: 120
      runs-on:
        type: string
        default: ubuntu-24.04
      egress-policy:
        description: harden-runner egress policy (audit or block).
        type: string
        default: audit

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      slug: ${{ steps.plan.outputs.slug }}
      primary-version: ${{ steps.plan.outputs.primary-version }}
      install-command: ${{ steps.plan.outputs.install-command }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/setup
      - name: Resolve the toolchain
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          GOLDEN_INPUTS: ${{ toJSON(inputs) }}
          LANGUAGE: ${{ inputs.language }}
        run: golden plan --language "$LANGUAGE"

  scan:
    name: flaky scan
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      REPORT_EXT: ${{ inputs.language == 'go' && 'json' || 'xml' }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/setup
        with:
          language: ${{ inputs.language }}
          version: ${{ needs.plan.outputs.primary-version }}
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ needs.plan.outputs.install-command }}

      # A red run must not stop the loop: a test that fails in one run and passes in the next
      # is exactly what this job looks for. Every exit status is logged; a run that crashed
      # before writing its report is caught by the scan, which fails on a missing report.
      - name: Run the suite ${{ inputs.runs }}x in random order
        working-directory: ${{ inputs.working-directory }}
        env:
          CMD: ${{ inputs.test-command }}
          LANGUAGE: ${{ inputs.language }}
          RUNS: ${{ inputs.runs }}
          REPORT_DIR: ${{ runner.temp }}/golden-flaky
          CI: "true"
        run: |
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 2 ]; then
            echo "::error::runs must be a whole number of at least 2 (one run cannot tell a flaky test from a failing one), got '$RUNS'"
            exit 1
          fi
          cmd="${CMD:-$(golden flaky-scan --print-command "$LANGUAGE")}"
          mkdir -p "$REPORT_DIR"
          statuses=()
          for i in $(seq "$RUNS"); do
            echo "::group::Run $i of $RUNS"
            status=0
            GOLDEN_REPORT="$REPORT_DIR/run-$i.$REPORT_EXT" bash -euo pipefail -c "$cmd" || status=$?
            echo "::endgroup::"
            echo "Run $i of $RUNS exited with status $status"
            statuses+=("$status")
          done
          echo "Exit statuses: ${statuses[*]}"

      - name: Scan the reports for flaky tests
        if: ${{ !cancelled() }}
        env:
          RUNS: ${{ inputs.runs }}
          REPORT_DIR: ${{ runner.temp }}/golden-flaky
        run: |
          reports=()
          for i in $(seq "$RUNS"); do
            reports+=("$REPORT_DIR/run-$i.$REPORT_EXT")
          done
          golden flaky-scan --json "$REPORT_DIR/flaky-scan.json" "${reports[@]}"

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-flaky-scan-${{ needs.plan.outputs.slug }}
          path: ${{ runner.temp }}/golden-flaky
          if-no-files-found: error
          retention-days: 7
