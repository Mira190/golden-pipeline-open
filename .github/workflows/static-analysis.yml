# Dogfooding the diff-scoped static-analysis gate: CodeQL findings on the lines a pull request
# changes, through the same reusable workflow consumers call. codeql.yml still uploads the
# full results to code scanning; this job only judges the change.
name: static-analysis

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    uses: $/.github/workflows/sast.yml
    permissions:
      contents: read
      actions: read
    with:
      languages: python
