# Build, scan and (on the default branch) publish a signed container image.
#
#   jobs:
#     container:
#       uses: Mira190/golden-pipeline-open/.github/workflows/container.yml@<sha> # v1.x.y
#       permissions:
#         contents: read
#         packages: write      # push to ghcr.io
#         id-token: write      # keyless Sigstore signing
#         attestations: write  # SLSA provenance + SBOM attestations
#
# Consumers verify before deploying:
#   gh attestation verify oci://ghcr.io/OWNER/IMAGE@sha256:... --owner OWNER \
#     --signer-workflow Mira190/golden-pipeline-open/.github/workflows/container.yml \
#     --source-ref refs/heads/main --deny-self-hosted-runners
name: golden-container

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      image:
        description: Image name without registry (defaults to the repository name).
        type: string
        default: ""
      smoke-command:
        description: Run against the built image; $IMAGE is set. Empty = skip.
        type: string
        default: ""
      severity-cutoff:
        description: Fail when grype finds a fixable vulnerability at or above this severity.
        type: string
        default: high
      runs-on:
        type: string
        default: ubuntu-24.04
      egress-policy:
        type: string
        default: audit
    outputs:
      digest:
        description: Digest of the published image (default branch only).
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  build:
    name: build and scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: golden-candidate:${{ github.sha }}
      - name: Smoke test
        if: inputs.smoke-command != ''
        env:
          IMAGE: golden-candidate:${{ github.sha }}
          CMD: ${{ inputs.smoke-command }}
        run: bash -euo pipefail -c "$CMD"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: golden-candidate:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: golden-candidate:${{ github.sha }}
          fail-build: true
          only-fixed: true
          severity-cutoff: ${{ inputs.severity-cutoff }}
          output-format: table

  # Release job: rebuilt from source with no cache restore, so nothing a pull
  # request wrote into the Actions cache can reach a published artifact.
  publish:
    name: publish signed image
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image || github.event.repository.name }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: SBOM of the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance (SLSA, Sigstore keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
