name: Golden setup
description: >-
  Install uv and the golden CLI from the same commit as the calling Golden
  Pipeline workflow, then set up the project's language toolchain.
inputs:
  language:
    description: python, node or go (empty = golden CLI only)
    default: ""
  version:
    description: Language version; for Go, "go.mod" reads go-version-file.
    default: ""
  working-directory:
    default: "."
  install-command:
    description: Dependency install command (empty = skip)
    default: ""
  cache:
    description: Restore dependency caches (never enable in release jobs).
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: "0.13.1"
        enable-cache: ${{ inputs.language == 'python' && inputs.cache == 'true' }}
        cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock
        python-version: ${{ inputs.language == 'python' && inputs.version || '' }}

    # The action directory lives inside the Golden Pipeline repository checked
    # out at the exact commit the caller pinned, so the CLI always matches the
    # workflow version without a separate release of the tool.
    - name: Install golden CLI
      shell: bash
      env:
        GOLDEN_SRC: ${{ github.action_path }}/../..
      # setup-uv puts uv's tool bin directory on PATH, so `golden` is available
      # to every later step.
      run: uv tool install --quiet --python 3.13 "$GOLDEN_SRC"

    - if: inputs.language == 'node'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.version }}
    - if: inputs.language == 'node' && hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != ''
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - if: inputs.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ (inputs.version == '' || inputs.version == 'go.mod') && format('{0}/go.mod', inputs.working-directory) || '' }}
        go-version: ${{ (inputs.version != '' && inputs.version != 'go.mod') && inputs.version || '' }}
        cache: ${{ inputs.cache == 'true' && hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - if: inputs.install-command != ''
      name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$INSTALL"
