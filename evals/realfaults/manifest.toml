# Real-fault benchmark manifest. See README.md in this directory for the protocol.
#
# Candidate lists were taken on 2026-10-22 from the pinned snapshot HEAD of each project:
#   git log --no-merges -i -E --grep='\b(fix|fixes|fixed|bug|regression)\b' <snapshot>
# and examined in that order (newest first) until the project's quota of kept bugs was met.
# Every examined commit is either a [[bug]] or a [[discarded]] entry.

