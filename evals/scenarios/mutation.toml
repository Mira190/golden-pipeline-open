[[scenario]]
id = "mutation/malformed-mutant"
gate = "mutation"
category = "robustness"
why = "A report missing `location` (schema drift in a tool upgrade) must fail closed with a message."
argv = ["mutation", "reports/mutation.json", "--format", "stryker", "--base", "{base}"]
expect = "error"
