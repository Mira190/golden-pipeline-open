# Mutation score gate and mutation scoping.
#
# Reports are artifacts written by the mutation tool; the gate narrows them to
# the lines the PR changed (`--base`).

[[scenario]]
id = "mutation/stryker-survivor-blocks"
gate = "mutation"
category = "gaming"
why = "Baseline: a surviving mutant on a changed line."
argv = ["mutation", "reports/mutation.json", "--format", "stryker", "--base", "{base}"]
expect = "block"
[scenario.base]
"src/a.ts" = "export const a = 1;\n"
[scenario.head]
"src/a.ts" = "export const a = 1;\nexport function f(x: number) {\n  return x > 1;\n}\n"
[scenario.artifacts]
"reports/mutation.json" = '''{"schemaVersion": "2", "thresholds": {"high": 80, "low": 60}, "files": {"src/a.ts": {"language": "typescript", "source": "", "mutants": [
 {"id": "1", "mutatorName": "EqualityOperator", "status": "Survived", "location": {"start": {"line": 3, "column": 10}, "end": {"line": 3, "column": 15}}},
 {"id": "2", "mutatorName": "BooleanLiteral", "status": "Killed", "location": {"start": {"line": 3, "column": 10}, "end": {"line": 3, "column": 15}}}
]}}}'''

[[scenario]]
id = "mutation/stryker-killed-passes"
gate = "mutation"
category = "legit"
why = "Baseline: every mutant on changed lines killed; a survivor on an untouched line is ignored."
argv = ["mutation", "reports/mutation.json", "--format", "stryker", "--base", "{base}"]
expect = "pass"
[scenario.base]
"src/a.ts" = "export const a = 1;\n"
[scenario.head]
"src/a.ts" = "export const a = 1;\nexport function f(x: number) {\n  return x > 1;\n}\n"
[scenario.artifacts]
"reports/mutation.json" = '''{"schemaVersion": "2", "thresholds": {"high": 80, "low": 60}, "files": {"src/a.ts": {"language": "typescript", "source": "", "mutants": [
 {"id": "1", "mutatorName": "EqualityOperator", "status": "Killed", "location": {"start": {"line": 3, "column": 10}, "end": {"line": 3, "column": 15}}},
 {"id": "2", "mutatorName": "StringLiteral", "status": "Survived", "location": {"start": {"line": 1, "column": 1}, "end": {"line": 1, "column": 5}}}
]}}}'''

