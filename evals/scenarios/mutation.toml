[[scenario]]
id = "mutation/waiver-added-in-pr"
gate = "mutation"
category = "gaming"
why = "The PR waives the mutation gate for its own weak tests."
argv = ["mutation", "reports/mutation.json", "--format", "stryker", "--base", "{base}"]
expect = "block"
[scenario.base]
"src/a.ts" = "export const a = 1;\n"
[scenario.head]
"src/a.ts" = "export const a = 1;\nexport function f(x: number) {\n  return x > 1;\n}\n"
"golden.toml" = "[waivers.mutation]\nreason = \"tests later\"\nexpires = {in30days}\n"
[scenario.artifacts]
"reports/mutation.json" = '''{"schemaVersion": "2", "thresholds": {"high": 80, "low": 60}, "files": {"src/a.ts": {"language": "typescript", "source": "", "mutants": [
 {"id": "1", "mutatorName": "EqualityOperator", "status": "Survived", "location": {"start": {"line": 3, "column": 10}, "end": {"line": 3, "column": 15}}}
]}}}'''

[[scenario]]
id = "mutation-targets/python-functions"
gate = "mutation-targets"
category = "legit"
why = "Baseline: only the changed function and method are mutated."
argv = ["changed", "--base", "{base}", "--preset", "python", "--kind", "mutation-targets", "--sep", "newline"]
expect_lines = ["pkg.mod.x_first__mutmut_*", "pkg.mod.xǁCartǁadd__mutmut_*"]
[scenario.base]
"pkg/mod.py" = "def first(a):\n    return a + 1\n\n\ndef other(a):\n    return a\n\n\nclass Cart:\n    def add(self, x):\n        return x\n"
[scenario.head]
"pkg/mod.py" = "def first(a):\n    return a + 2\n\n\ndef other(a):\n    return a\n\n\nclass Cart:\n    def add(self, x):\n        return x * 2\n"
"tests/test_mod.py" = "import pkg.mod\n"

[[scenario]]
id = "mutation-targets/exempt-added-in-pr"
gate = "mutation-targets"
category = "gaming"
why = "A presence.exempt glob added by the PR also hid its code from mutation testing."
argv = ["changed", "--base", "{base}", "--preset", "python", "--kind", "mutation-targets", "--sep", "newline"]
expect_lines = ["pkg.mod.x_first__mutmut_*"]
[scenario.base]
"pkg/mod.py" = "def first(a):\n    return a + 1\n"
[scenario.head]
"pkg/mod.py" = "def first(a):\n    return a + 2\n"
"golden.toml" = "[presence]\nexempt = [\"pkg/**\"]\n"
