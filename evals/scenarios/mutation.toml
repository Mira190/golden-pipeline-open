[[scenario]]
id = "mutation/elements-format-name"
gate = "mutation"
category = "legit"
why = "The report schema is tool-neutral (mutation-testing-elements); Stryker.NET, Stryker4s and muttest emit it too."
argv = ["mutation", "mutation.json", "--format", "mutation-testing-elements", "--base", "{base}"]
expect = "block"
[scenario.base]
"src/A.cs" = "class A {}\n"
[scenario.head]
"src/A.cs" = "class A {\n  bool F(int x) { return x > 1; }\n}\n"
[scenario.artifacts]
"mutation.json" = '''{"schemaVersion": "2", "thresholds": {"high": 80, "low": 60}, "files": {"src/A.cs": {"language": "cs", "source": "", "mutants": [
 {"id": "1", "mutatorName": "Equality", "status": "Survived", "location": {"start": {"line": 2, "column": 26}, "end": {"line": 2, "column": 31}}}
]}}}'''

[[scenario]]
id = "mutation/gremlins-mostly-timeouts"
gate = "mutation"
category = "robustness"
why = "Baseline: a miscalibrated timeout makes most mutants 'time out'; that run proves nothing."
argv = ["mutation", "gremlins.json", "--format", "gremlins", "--base", "{base}"]
expect = "block"
[scenario.base]
"pricing/p.go" = "package pricing\n"
[scenario.head]
"pricing/p.go" = "package pricing\n\nfunc F(x int) bool {\n\treturn x > 1\n}\n"
[scenario.artifacts]
"gremlins.json" = '''{"files": [{"file_name": "pricing/p.go", "mutations": [
 {"line": 4, "column": 11, "type": "CONDITIONALS_BOUNDARY", "status": "TIMED OUT"},
 {"line": 4, "column": 11, "type": "CONDITIONALS_NEGATION", "status": "TIMED OUT"},
 {"line": 4, "column": 11, "type": "ARITHMETIC_BASE", "status": "KILLED"}
]}]}'''

