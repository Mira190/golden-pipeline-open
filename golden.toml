# Policy for this repository's own code (the golden CLI). Values may only be
# stricter than the platform floor; see docs/configuration.md.

[coverage]
diff_min = 95
ratchet_tolerance = 0.2

[mutation]
min_score = 80

[flaky]
repeats = 10

[scorecard]
min_level = 2

[presence]
# The drill harness has no unit tests of its own: it *is* an end-to-end test of
# the gates, run against real toolchains by ci.yml's `gate drills` job.
exempt = ["scripts/**"]
